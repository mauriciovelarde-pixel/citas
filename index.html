<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#f3f6f5;
  --surface:#ffffff;
  --ink:#13262b;
  --muted:#586a6f;
  --line:#d9e3e1;
  --primary:#0b6e6e;
  --primary-ink:#ffffff;
  --primary-soft:#e2f0ee;
  --ok:#1d7440;--ok-bg:#e3f3e8;
  --warn:#835400;--warn-bg:#fcefd4;
  --bad:#a12a22;--bad-bg:#fbe3e0;
  --display:'Newsreader',Georgia,serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
/* Layout: mobile-first single column for the patient (one decision per screen); wider column for the admin desk */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;font-size:16px}
a{color:var(--primary)}
.demo{background:#13262b;color:#e8f0ef;font-size:.9rem}
.demo-in{max-width:1080px;margin:0 auto;padding:8px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo strong{color:#fff}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.seg button{background:transparent;color:#e8f0ef;border:0;border-radius:0;padding:4px 12px;font-size:.85rem;font-weight:600}
.seg button[aria-pressed="true"]{background:#fff;color:#13262b}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:0;flex:1;white-space:nowrap;letter-spacing:-.01em}
.brand span{color:var(--primary)}
.auth{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted);flex-wrap:wrap}
.nav{max-width:1080px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow-x:auto}
.nav a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.nav a[aria-current="page"]{color:var(--ink);border-color:var(--primary)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:.75rem;margin-left:4px;font-variant-numeric:tabular-nums}
main{padding:22px 18px 72px}
.col{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.col-wide{max-width:1080px}
h2{font-family:var(--display);font-weight:600;font-size:1.75rem;line-height:1.2;margin:0;text-wrap:balance}
h3{margin:0;font-size:1.05rem}
.sub{margin:0;color:var(--muted)}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;padding:11px 16px;font-weight:600;border:1.5px solid var(--primary);background:var(--primary);color:var(--primary-ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,.btn:hover{filter:brightness(.94)}
button:disabled{opacity:.5;cursor:not-allowed;filter:none}
.ghost{background:transparent;color:var(--primary)}
.ghost:hover{background:var(--primary-soft);filter:none}
.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.small{padding:6px 11px;font-size:.88rem;border-radius:8px}
.block{width:100%}
.back{background:none;border:0;color:var(--primary);padding:0;font-weight:600;align-self:flex-start}
.back:hover{text-decoration:underline;filter:none}
:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps li{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.steps li::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.steps li.done::before,.steps li.now::before{background:var(--primary)}
.steps li.now{color:var(--ink);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.esp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.esp{flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);padding:16px;text-align:left;min-height:84px;justify-content:center}
.esp:hover{border-color:var(--primary);background:var(--primary-soft);filter:none}
.esp b{font-size:1.02rem}
.esp small{color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.doc-top{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:48px;height:48px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-family:var(--display);font-size:1.15rem}
.doc-top .grow{flex:1;min-width:0}
.price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.price small{display:block;font-weight:500;color:var(--muted);font-size:.75rem;text-align:right}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
details summary{cursor:pointer;color:var(--primary);font-weight:600;font-size:.92rem}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:.93rem}
.meta dt{color:var(--muted)}
.meta dd{margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);padding:10px 14px;min-width:84px;flex-direction:column;gap:0;line-height:1.25}
.chip small{font-weight:500;color:var(--muted);font-size:.78rem}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.chip[aria-pressed="true"] small{color:#d7ecea}
.chip:hover{filter:none;border-color:var(--primary)}
.summary{background:var(--primary-soft);border-radius:12px;padding:14px 16px}
.summary .meta{margin:0}
label{font-weight:600;font-size:.92rem;display:flex;flex-direction:column;gap:5px}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none}
.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
.hint{font-size:.88rem;color:var(--muted);margin:0}
.notice{background:var(--warn-bg);color:#5c3b00;border-radius:10px;padding:10px 12px;font-size:.9rem;margin:0}
.err{color:var(--bad);font-size:.9rem;margin:0;min-height:1.2em}
.done-box{text-align:center;align-items:center;padding:28px 18px}
.done-icon{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:2rem;font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.st-pendiente{background:var(--warn-bg);color:var(--warn)}
.st-confirmada{background:var(--ok-bg);color:var(--ok)}
.st-rechazada,.st-cancelada{background:var(--bad-bg);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.when{font-weight:700;font-size:1.02rem}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.form-grid .wide{grid-column:1/-1}
.tabs2{display:flex;gap:8px;flex-wrap:wrap}
.tabs2 button{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.tabs2 button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.off{opacity:.6}
dialog{border:0;border-radius:16px;padding:0;width:calc(100% - 32px);max-width:420px;color:var(--ink)}
dialog::backdrop{background:rgba(19,38,43,.5)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:1.45rem}
.gbtn{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.gbtn:hover{border-color:var(--primary);filter:none}
.gmark{font-weight:800;color:#1a73e8}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{background:none;border:0;padding:0;color:var(--primary);font-weight:600;font-size:.9rem;align-self:flex-start}
.linkbtn:hover{text-decoration:underline;filter:none}
.ok{color:var(--ok);font-size:.9rem;margin:0}
.paybox{border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:#fbfdfc}
.yape{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qr{width:128px;height:128px;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:#fff;flex:none}
.qr-empty{display:grid;place-items:center;color:var(--muted);font-size:.85rem}
.yape-num{font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.late{color:var(--bad);font-weight:600}
.pg-porpagar{background:var(--warn-bg);color:var(--warn)}
.pg-verificando{background:#e2eafa;color:#1f4a91}
.pg-pagada{background:var(--ok-bg);color:var(--ok)}
.okbox{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 12px;margin:0;font-weight:600}
.callout{background:#e2eafa;color:#1f4a91;border-radius:10px;padding:10px 12px;margin:0;font-size:.93rem}
details.paid summary{list-style:none}
details.paid summary::-webkit-details-marker{display:none}
details.paid[open] summary{display:none}
.receipt{max-width:100%;max-height:520px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff;align-self:flex-start}
.thumb{max-width:140px;max-height:180px;border:1px solid var(--line);border-radius:8px}
.sendrow{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.lbl{font-weight:600;font-size:.92rem}
.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:600}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
@media (max-width:420px){main,.top-in,.nav,.demo-in{padding-left:16px;padding-right:16px}h2{font-size:1.5rem}.brand{font-size:1.25rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials = n => String(n||"?").replace(/^(dr|dra)\.?\s+/i,"").split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();
const pad = n => String(n).padStart(2,"0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOf = iso => { const [y,m,d]=String(iso).split("-").map(Number); return new Date(y,m-1,d); };
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const longDate = iso => cap(dateOf(iso).toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"long"}));
const shortDate = iso => cap(dateOf(iso).toLocaleDateString("es-PE",{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,""));
const addDays = (n) => { const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()+n); };

/* ---------- Capa de datos: Firebase real o demostración ---------- */
function firebaseApi(appMod, F, A){
  const app=appMod.initializeApp(firebaseConfig);
  const db=F.getFirestore(app), auth=A.getAuth(app);
  auth.languageCode="es";
  const map = s => s.docs.map(d=>({id:d.id,...d.data()}));
  const toUser = u => u ? {uid:u.uid,email:(u.email||"").toLowerCase(),name:u.displayName||"",verified:!!u.emailVerified} : null;
  return {
    demo:false,
    onAuth: cb => A.onAuthStateChanged(auth, u=>cb(toUser(u))),
    loginGoogle: async () => toUser((await A.signInWithPopup(auth,new A.GoogleAuthProvider())).user),
    loginEmail: async (e,p) => toUser((await A.signInWithEmailAndPassword(auth,e,p)).user),
    signupEmail: async (name,e,p) => {
      const c=await A.createUserWithEmailAndPassword(auth,e,p);
      try{ await A.updateProfile(c.user,{displayName:name}); }catch(_){}
      try{ await A.sendEmailVerification(c.user); }catch(_){}
      return {...toUser(c.user),name};
    },
    resetPassword: e => A.sendPasswordResetEmail(auth,e),
    saveReceipt: (id,img,uid) => F.setDoc(F.doc(db,"comprobantes",id),{imagen:img,pacienteUid:uid,subido:F.serverTimestamp()}),
    getReceipt: async id => { const s=await F.getDoc(F.doc(db,"comprobantes",id)); return s.exists()?s.data().imagen:null; },
    deleteReceipt: id => F.deleteDoc(F.doc(db,"comprobantes",id)),
    watchConfig: cb => F.onSnapshot(F.doc(db,"config","pagos"), s=>cb(s.exists()?s.data():{}), ()=>cb({})),
    saveConfig: data => F.setDoc(F.doc(db,"config","pagos"),data),
    logout: () => A.signOut(auth),
    watchDoctors: (cb,err) => F.onSnapshot(F.collection(db,"doctores"), s=>cb(map(s)), err),
    watchMine: (uid,cb,err) => F.onSnapshot(F.query(F.collection(db,"solicitudes"),F.where("pacienteUid","==",uid)), s=>cb(map(s)), err),
    watchAll: (cb,err) => F.onSnapshot(F.collection(db,"solicitudes"), s=>cb(map(s)), err),
    addRequest: data => F.addDoc(F.collection(db,"solicitudes"),{...data,creada:F.serverTimestamp()}),
    updateRequest: (id,data) => F.updateDoc(F.doc(db,"solicitudes",id),data),
    saveDoctor: (id,data) => id ? F.setDoc(F.doc(db,"doctores",id),data) : F.addDoc(F.collection(db,"doctores"),data),
    updateDoctor: (id,data) => F.updateDoc(F.doc(db,"doctores",id),data),
    deleteDoctor: id => F.deleteDoc(F.doc(db,"doctores",id))
  };
}

$("view-inicio").addEventListener("click", e=>{

  else if(a==="dia"){ flow.fecha=val; renderFlow(); }

/* ---------- Comprimir imágenes (capturas) ---------- */
function loadImg(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), img=new Image(); img.onload=()=>{ URL.revokeObjectURL(url); res(img); }; img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); }; img.src=url; }); }
async function compressImage(file){
  const img=await loadImg(file); let max=1000, q=0.75, out="";
  for(let i=0;i<8;i++){
    const s=Math.min(1,max/Math.max(img.width,img.height)), cv=document.createElement("canvas");
    cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
    const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
    out=cv.toDataURL("image/jpeg",q); if(out.length<700000) return out;
    if(q>0.45) q-=0.15; else max=Math.round(max*0.75);
  }
  throw new Error("big");
}

  if(d.toDateString()===t.toDateString()) return `hoy a las ${tm}`;
  const m=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1);
  if(d.toDateString()===m.toDateString()) return `mañana a las ${tm}`;
  return `el ${d.toLocaleDateString("es-PE",{weekday:"long",day:"numeric"})} a las ${tm}`;
};

function msgFor(r, kind){
  const d=docById(r.doctorId), c=config||{}, primer=String(r.pacienteNombre||"").split(" ")[0];
  const fecha=longDate(r.fecha).toLowerCase().replace(",","");
  const lugar = r.modalidad==="Virtual" ? " por videollamada" : d?.distrito ? ` en ${d.distrito}` : "";
  const link=`${location.origin}${location.pathname}#mis-citas`, pedir=`${location.origin}${location.pathname}`;
  const yape=`${money(r.monto)} por Yape al ${c.yapeNumero||""}${c.yapeTitular?` (${c.yapeTitular})`:""}`;
  const plazo=r.pagarAntes?` antes de ${fmtDeadline(r.pagarAntes).replace(/^el /,"")}`:"";
  const firma="\n\nAgenda Médica";
  switch(kind){
    case "confirmada": {
      const pagar = r.pago==="por_pagar" && c.yapeNumero ? ` Para reservar tu cupo, paga ${yape}${plazo}. Luego entra a ${link} y pulsa «Ya pagué».` : "";
      return {subject:`Tu cita con ${r.doctorNombre} está confirmada`,
        text:`Hola ${primer}, tu cita con ${r.doctorNombre} (${r.especialidad}) quedó confirmada para el ${fecha} a las ${r.hora}${lugar}.${r.nota?" "+r.nota:""}${pagar} Si no puedes asistir, avísanos respondiendo este mensaje.${firma}`};
    }
    case "recordatorio":
      return {subject:`Recordatorio de pago: tu cita con ${r.doctorNombre}`,
        text:`Hola ${primer}, te recordamos que tu cita del ${fecha} a las ${r.hora} se reserva con el pago de ${yape}${plazo}. Si ya pagaste, entra a ${link} y pulsa «Ya pagué».${firma}`};
    case "pagado":
      return {subject:`Pago recibido: tu cita con ${r.doctorNombre}`,
        text:`Hola ${primer}, recibimos tu pago de ${money(r.monto)}. Tu cita con ${r.doctorNombre} el ${fecha} a las ${r.hora}${lugar} está reservada. ¡Te esperamos!${firma}`};
    case "liberada":
      return {subject:`Tu cita con ${r.doctorNombre} fue liberada`,
        text:`Hola ${primer}, como no recibimos el pago a tiempo, liberamos tu cita del ${fecha}. Si aún la necesitas, puedes pedir otra fecha aquí: ${pedir}${firma}`};
    default:
      return {subject:`Sobre tu solicitud de cita con ${r.doctorNombre}`,
        text:`Hola ${primer}, lamentablemente no hay disponibilidad con ${r.doctorNombre} para el ${fecha}.${r.nota?" "+r.nota:""} Puedes pedir otra fecha aquí: ${pedir}${firma}`};
  }
}

let pendingQr, payMsg="";
function resizeQr(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const max=360, s=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement("canvas"); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url); let d=cv.toDataURL("image/png"); if(d.length>400000) d=cv.toDataURL("image/jpeg",0.9); res(d); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src=url;
  });
}

    if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent="¿Liberar? Pulsa otra vez"; return; }
    b.disabled=true;
    try{ await api.updateRequest(id,{estado:"cancelada",liberada:true,nota:"No se recibió el pago a tiempo."}); adm.filtro="cerradas"; }catch(_){ b.disabled=false; }
  }
  else if(a==="vercap"){
    const box=$("rc-"+id); if(box.firstChild){ box.innerHTML=""; b.textContent="Ver captura"; return; }
    b.disabled=true; b.textContent="Cargando…";
    try{
      const img=await api.getReceipt(id);
      box.innerHTML = img ? `<img class="receipt" src="${img}" alt="Captura de pago de Yape enviada por el paciente"><button class="danger small" style="align-self:flex-start" data-act="delcap" data-v="${id}">Borrar captura</button>` : `<p class="hint">La captura ya fue borrada.</p>`;
      b.textContent="Ocultar captura";
    }catch(ex){ box.innerHTML=`<p class="err">No se pudo cargar la captura.</p>`; b.textContent="Ver captura"; }
    b.disabled=false;
  }
  else if(a==="delcap"){
    if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent="¿Borrar? Pulsa otra vez"; return; }
    b.disabled=true;
    try{ await api.deleteReceipt(id); await api.updateRequest(id,{comprobante:false}); }catch(_){ b.disabled=false; b.textContent="No se pudo borrar"; }
  }
  else if(a==="qrdel"){ pendingQr=null; const p=$("pQrPrev"); p.outerHTML=`<div class="qr qr-empty" id="pQrPrev">Sin QR</div>`; b.remove(); $("pOk").textContent="Se quitará el QR al guardar."; }
  else if(a==="dedit"){
    const d=docById(id); if(!d) return;
    $("dId").value=d.id; for(const [k,f] of Object.entries(DF)) $(f).value=d[k]??"";
    $("dActivo").checked=d.activo!==false; $("dfTitle").textContent="Editar doctor"; $("dCancel").hidden=false;
    $("docForm").scrollIntoView({behavior:"smooth",block:"start"}); $("dNombre").focus();
  }
  else if(a==="dcancel"){ renderAdmin(); }
  else if(a==="dtoggle"){ const d=docById(id); await api.updateDoctor(id,{activo:d.activo===false}); }
  else if(a==="ddel"){
    if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent="¿Seguro? Pulsa otra vez"; return; }
    await api.deleteDoctor(id);
  }
});
$("view-admin").addEventListener("submit", async e=>{
  e.preventDefault();
  if(e.target.id==="payForm"){
    const num=$("pNum").value.trim();
    if(num && digits(num).length<9){ $("pErr").textContent="Revisa el número de Yape (9 dígitos)."; $("pNum").focus(); return; }
    const data={yapeNumero:num,yapeTitular:$("pTit").value.trim(),plazoHoras:Number($("pPlazo").value),politica:$("pPol").value.trim(),qr: pendingQr===undefined ? (config.qr||"") : (pendingQr||"")};
    $("pSave").disabled=true; $("pErr").textContent="";
    try{ payMsg="Datos de pago guardados."; await api.saveConfig(data); pendingQr=undefined; const o=$("pOk"); if(o) o.textContent=payMsg; }
    catch(ex){ $("pErr").textContent="No se pudo guardar ("+(ex.code||"error")+")."; }
    finally{ const s=$("pSave"); if(s) s.disabled=false; }
    return;
  }
  if(e.target.id!=="docForm") return;
  const data={}; for(const [k,f] of Object.entries(DF)) data[k]=$(f).value.trim();
  if(!data.nombre||!data.especialidad){ $("dErr").textContent="Nombre y especialidad son obligatorios."; return; }
  data.precio = data.precio==="" ? null : Number(data.precio);
  data.activo = $("dActivo").checked;
  $("dSave").disabled=true;
  try{ await api.saveDoctor($("dId").value||null,data); }
  catch(ex){ $("dErr").textContent="No se pudo guardar ("+(ex.code||"error")+")."; $("dSave").disabled=false; }
});

/* ---------- Ventana de acceso (Google o correo) ---------- */
let authResolve=null, authMode="login";
const AUTH_ERR={
  "auth/invalid-credential":"Correo o contraseña incorrectos.","auth/wrong-password":"Correo o contraseña incorrectos.","auth/user-not-found":"No hay una cuenta con ese correo. Elige «Crear cuenta».",
  "auth/email-already-in-use":"Ese correo ya tiene una cuenta. Elige «Ya tengo cuenta».","auth/invalid-email":"Revisa el correo, parece incompleto.",
  "auth/weak-password":"La contraseña debe tener al menos 6 caracteres.","auth/too-many-requests":"Demasiados intentos. Espera unos minutos.",
  "auth/popup-blocked":"Tu navegador bloqueó la ventana de Google. Permite ventanas emergentes.","auth/unauthorized-domain":"Este sitio todavía no está autorizado en Firebase.",
  "auth/operation-not-allowed":"El acceso con correo no está activado todavía. Usa Google o avisa al administrador.","auth/network-request-failed":"Sin conexión. Revisa tu internet."
};
function setAuthMode(m){
  authMode=m;
  document.querySelectorAll("#authDlg [data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===m));
  $("aNameWrap").hidden=m!=="signup"; $("aPassHint").hidden=m!=="signup"; $("aReset").hidden=m!=="login";
  $("aPass").autocomplete = m==="signup"?"new-password":"current-password";
  $("aSubmit").textContent = m==="signup"?"Crear cuenta y continuar":"Entrar";
  $("aErr").textContent=""; $("aOk").textContent="";
}
function openAuth(lead){
  $("authLead").textContent = lead || "Así podrás ver el estado de tus citas en cualquier momento.";
  setAuthMode("login"); $("aPass").value="";
  if(!$("authDlg").open) $("authDlg").showModal();
  return new Promise(res=>{ authResolve=res; });
}
function finishAuth(u){ const r=authResolve; authResolve=null; if($("authDlg").open) $("authDlg").close(); r&&r(u); }
$("authDlg").addEventListener("close",()=>{ if(authResolve){ const r=authResolve; authResolve=null; r(null); } });
$("authClose").addEventListener("click",()=>$("authDlg").close());
$("authForm").addEventListener("input",()=>{ $("aErr").textContent=""; });
document.querySelectorAll("#authDlg [data-mode]").forEach(b=>b.addEventListener("click",()=>setAuthMode(b.dataset.mode)));
$("authGoogle").addEventListener("click", async ()=>{
  $("aErr").textContent="";
  try{ finishAuth(await api.loginGoogle()); }
  catch(ex){ if(ex.code!=="auth/popup-closed-by-user"&&ex.code!=="auth/cancelled-popup-request") $("aErr").textContent=AUTH_ERR[ex.code]||"No se pudo entrar con Google."; }
});
$("authForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const email=$("aEmail").value.trim(), pass=$("aPass").value, name=$("aName").value.trim();
  $("aErr").textContent=""; $("aOk").textContent="";
  if(authMode==="signup" && !name){ $("aErr").textContent="Escribe tu nombre."; $("aName").focus(); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $("aErr").textContent="Revisa el correo, parece incompleto."; $("aEmail").focus(); return; }
  if(pass.length<6){ $("aErr").textContent="La contraseña debe tener al menos 6 caracteres."; $("aPass").focus(); return; }
  const btn=$("aSubmit"); btn.disabled=true;
  try{ finishAuth(authMode==="signup" ? await api.signupEmail(name,email,pass) : await api.loginEmail(email,pass)); }
  catch(ex){ $("aErr").textContent=AUTH_ERR[ex.code]||"No se pudo continuar. Inténtalo otra vez."; }
  finally{ btn.disabled=false; }
});
$("aReset").addEventListener("click", async ()=>{
  const email=$("aEmail").value.trim(); $("aErr").textContent=""; $("aOk").textContent="";
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $("aErr").textContent="Escribe tu correo arriba y vuelve a pulsar aquí."; $("aEmail").focus(); return; }
  try{ await api.resetPassword(email); $("aOk").textContent="Si ese correo tiene cuenta, te enviamos un enlace para crear una nueva contraseña."; }
  catch(ex){ $("aErr").textContent=AUTH_ERR[ex.code]||"No se pudo enviar el correo."; }
});

/* ---------- Cabecera y sesión ---------- */
function renderHeader(){
  $("who").textContent = user ? (user.name||user.email) : "";
  $("loginBtn").hidden = !!user; $("logoutBtn").hidden = !user || api.demo;
  $("adminTab").hidden = !isAdmin;
  const p=all.filter(r=>r.estado==="pendiente").length+all.filter(r=>r.estado==="confirmada"&&r.pago==="por_pagar"&&r.pagoReportado).length;
  $("pendBadge").hidden = !(isAdmin && p); $("pendBadge").textContent = p;
  if(api.demo){
    const role = !user ? "none" : isAdmin ? "admin" : "paciente";
    document.querySelectorAll("#demoBar [data-role]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.role===role));
  }
}
function refresh(){
  renderHeader(); const t=currentTab();
  if(t==="inicio"){ if(flow.step<=2||flow.step===5) renderFlow(); return; }
  const ae=document.activeElement, view=$("view-"+t);
  if(view && view.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)){ ae.addEventListener("blur",()=>setTimeout(refresh,400),{once:true}); return; }
  route();
}

(async function start(){
  $("view-inicio").innerHTML=`<div class="empty">Cargando…</div>`;
  api = await loadApi();
  if(!api){ $("view-inicio").innerHTML=`<div class="empty">No se pudo conectar con el servidor. Revisa tu conexión a internet y recarga la página.<br><br><button onclick="location.reload()">Recargar</button></div>`; return; }
  if(api.demo){
    $("demoBar").hidden=false;
    $("demoBar").addEventListener("click",e=>{ const b=e.target.closest("[data-role]"); if(!b) return; api.setRole(b.dataset.role); if(b.dataset.role==="admin") location.hash="#admin"; else if(location.hash==="#admin") location.hash="#inicio"; });
  }
  $("loginBtn").addEventListener("click",()=>openAuth());
  $("logoutBtn").addEventListener("click",()=>api.logout());
  api.watchConfig(c=>{ config=c||{}; refresh(); });
  api.watchDoctors(list=>{ doctors=list; refresh(); }, err=>{ $("view-inicio").innerHTML=`<div class="empty">No se pudo cargar la lista de doctores (${esc(err.code)}).</div>`; });
  api.onAuth(u=>{
    user=u; isAdmin=!!(u&&u.verified&&ADMINS.includes(u.email));
    if(unMine){unMine();unMine=null;} if(unAll){unAll();unAll=null;} mine=[]; all=[];
    if(u) unMine=api.watchMine(u.uid, l=>{ mine=l; refresh(); }, ()=>{});
    if(isAdmin) unAll=api.watchAll(l=>{ all=l; refresh(); }, ()=>{});
    if(flow.step===4){ const f=$("fSend"); if(f&&!f.disabled) f.textContent=u?"Enviar solicitud":"Continuar y enviar"; }
    if(currentTab()!=="inicio") route();
    refresh();
  });
  route();
})();
</script>
